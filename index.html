<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Crash Demo — Portfolio</title>
    <link rel="stylesheet" href="/src/styles/hud.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header id="top-chrome" class="top-chrome">
        <div class="top-chrome__balance">
          <span class="money-icon" aria-hidden="true">$</span>
          <div class="balance" data-field="balance">—</div>
        </div>
        <div class="top-chrome__actions">
          <button type="button" data-action="reset-wallet" class="reset-demo">
            Reset demo
          </button>
          <button
            type="button"
            data-action="mute"
            class="mute-toggle"
            aria-pressed="false"
          >
            Sound: On
          </button>
        </div>
      </header>

      <div id="history-band" class="history-band">
        <div
          class="session-stats"
          data-field="session-stats"
          aria-label="Session stats"
        >
          <span>Avg <span data-field="stat-avg">—</span></span>
          <span>Max <span data-field="stat-max">n/a</span></span>
        </div>
        <div
          data-field="history"
          class="history-strip"
          role="list"
          aria-label="Crash history"
        ></div>
      </div>

      <!-- Reserved Pixi mount — keep empty of monetary controls (VIS-02) -->
      <div id="game-canvas-host" class="canvas-host" aria-label="Game view">
        <p class="canvas-placeholder">Game view</p>
      </div>

      <footer id="hud-bar" class="hud-bar">
        <div class="auto-row">
          <div class="auto-co-group">
            <label class="auto-toggle">
              <input
                type="checkbox"
                data-field="auto-co-toggle"
                aria-label="Auto cash out"
              />
              <span>Auto cash out</span>
            </label>
            <div class="stake-stepper auto-co-stepper">
              <button
                type="button"
                data-action="auto-co-dec"
                aria-label="Decrease auto cash out"
              >
                −
              </button>
              <input
                data-field="auto-co"
                type="number"
                min="1.01"
                step="0.01"
                placeholder="Off"
                disabled
                aria-label="Auto cash out multiplier"
              />
              <button
                type="button"
                data-action="auto-co-inc"
                aria-label="Increase auto cash out"
              >
                +
              </button>
            </div>
          </div>
          <label class="auto-toggle">
            <input
              type="checkbox"
              data-field="auto-bet-toggle"
              aria-label="Auto bet"
            />
            <span>Auto bet</span>
          </label>
        </div>

        <div class="action-row">
          <div class="stake-group">
            <div class="stake-stepper">
              <button
                type="button"
                data-action="stake-dec"
                aria-label="Decrease stake"
              >
                −
              </button>
              <input
                data-field="bet-input"
                type="number"
                min="10"
                max="1000"
                step="1"
                value="100"
                aria-label="Bet amount"
              />
              <button
                type="button"
                data-action="stake-inc"
                aria-label="Increase stake"
              >
                +
              </button>
            </div>
            <div
              data-field="chips"
              class="chip-row"
              role="group"
              aria-label="Bet presets"
            ></div>
          </div>
          <button type="button" data-action="primary" class="primary-cta primary-cta--bet">
            <span class="primary-cta__label" data-field="primary-label">BET</span>
            <span class="primary-cta__amount" data-field="primary-amount">100.00</span>
          </button>
        </div>

        <span data-field="phase" class="visually-hidden"></span>
        <span data-field="live-mult" class="visually-hidden">1.00×</span>
        <span data-field="status" class="hud-status" aria-live="polite"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
